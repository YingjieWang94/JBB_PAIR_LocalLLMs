run:
  name: jbb_pair_vicuna13b_v15
  out_root: C:\Projects\jbb_pair
  seed: 123
  split: harmful         # harmful | benign | both
  max_behaviors: 2000    # or 100 for paper JBB-Behaviors
  shard:
    num_shards: 1
    shard_idx: 0

data:
  manifest_jsonl: C:\Projects\jbb_pair\data\behaviours\jbb_manifest.jsonl

artifact:
  provider: jailbreakbench
  method: PAIR
  model_name: vicuna-13b-v1.5

# PAIR hyperparameters as stated in the JailbreakBench paper
# (attacker model choice is irrelevant here because we replay artifacts)
pair:
  max_depth_K: 3
  n_streams_N: 30
  attacker_temperature: 1.0
  attacker_top_p: 0.9

models:
  # This is the model you will actually run forward passes on.
  target_model_id: lmsys/vicuna-13b-v1.5

  # Judge: keep your local judge (you can swap later)
  guard_model_id: meta-llama/Llama-Guard-3-8B

generation:
  target:
    temperature: 0.7
    top_p: 0.9
    max_new_tokens: 512

system:
  profile: local       # local | server
  device: cuda
  dtype: fp16
  use_cache: true
  max_gpu_mem_util: 0.90
  offload_dir: C:\Projects\jbb_pair\.hf_offload
  fail_fast: false
