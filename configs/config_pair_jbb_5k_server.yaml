run:
  name: jbb_pair_5k_server_mixtral_vicuna
  out_root: /users/yjwang/scratch/jbb_pair_runs
  seed: 123
  split: harmful
  max_behaviors: 5000
  shard:
    num_shards: 1
    shard_idx: 0

data:
  manifest_jsonl: /users/yjwang/repos/JBB_PAIR_LocalLLMs/data/behaviours/behaviors_harmful_5000.jsonl

artifact:
  provider: jailbreakbench
  method: PAIR
  model_name: server_run

pair:
  max_depth_K: 3
  n_streams_N: 30
  attacker_temperature: 1.0
  attacker_top_p: 0.9

models:
  attacker_model_id: mistralai/Mixtral-8x7B-Instruct-v0.1
  target_model_id: lmsys/vicuna-13b-v1.5
  # keep your existing guard unless you want to change it
  guard_model_id: meta-llama/Llama-Guard-3-8B
  escalation_model_id: null

generation:
  target:
    temperature: 0.7
    top_p: 0.9
    max_new_tokens: 512

system:
  profile: server
  device: cuda
  dtype: bf16
  use_cache: true
  max_gpu_mem_util: 0.90
  offload_dir: /users/yjwang/scratch/.hf_offload
  fail_fast: true
